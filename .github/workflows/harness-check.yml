name: Harness Constraint Check

on:
  push:
    paths:
      - 'src/**/*.py'
      - 'harness/**'
      - 'tests/**/*.py'
      - 'pyproject.toml'
      - '.github/workflows/harness-check.yml'
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -e ".[test]"

      - name: Run harness rules check (dry-run with sample)
        run: |
          python scripts/check_harness.py --rules

      - name: Run unit tests
        run: python -m pytest tests/test_server.py -v

      # 回归测试：每条都对应一个真实用户 issue，必须在 CI 里跑，
      # 否则测试文件躺在仓库里也拦不住回退。
      - name: Run regression tests (real user issues)
        run: |
          python -m pytest -v \
            tests/test_db_tables_consistency.py \
            tests/test_batch_ids_no_silent_loss.py